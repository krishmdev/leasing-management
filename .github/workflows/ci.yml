name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    # The concurrency and crash-recovery contract tests need a real Postgres and Mailpit.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: leasing
          POSTGRES_PASSWORD: leasing
          POSTGRES_DB: leasing_test
        ports: ["5441:5432"]
        options: >-
          --health-cmd "pg_isready -U leasing" --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports: ["1041:1025", "8041:8025"]
    env:
      TEST_DATABASE_URL: postgresql://leasing:leasing@127.0.0.1:5441/leasing_test
      DATABASE_URL: postgresql://leasing:leasing@127.0.0.1:5441/leasing_test
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1041"
      MAILPIT_URL: http://127.0.0.1:8041
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: keys
        run: pnpm exec tsx scripts/gen-keys.ts >> "$GITHUB_ENV"
      - run: pnpm test:int

  e2e-offline:
    # Setup (network allowed): build the app image. Runtime: run it on the compose network that
    # has no egress; the egress canary in the web server and the worker must see every external
    # connection fail, and the whole Playwright suite runs there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait
      - run: docker build -f Dockerfile.e2e -t leasing-e2e .
      - name: e2e with no egress
        run: >-
          docker run --rm --network leasing_backend
          -e E2E_OFFLINE=1
          -e E2E_DATABASE_URL=postgresql://leasing:leasing@postgres:5432/leasing_e2e
          -e SMTP_HOST=mailpit -e SMTP_PORT=1025 -e MAILPIT_URL=http://mailpit:8025
          leasing-e2e
